name: Deploy via FTP

on:
  push:
    branches:
      - main # Altere para 'master' se o seu repositório usar o nome antigo

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🚀 Sync files via FTP
      uses: SamKirkland/FTP-Deploy@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # server-dir: /public_html/ # Opcional: pasta de destino no servidor se não for a raiz
